<h2 mat-dialog-title>{{ conta ? 'Editar conta' : 'Nova conta' }}</h2>

<form [formGroup]="form" (ngSubmit)="salvar()">
  <mat-dialog-content class="formulario">
    @if (envio.erro()) {
      <div class="erro-formulario" role="alert">{{ envio.erro() }}</div>
    }

    <mat-form-field>
      <mat-label>Nome</mat-label>
      <input
        matInput
        formControlName="nome"
        maxlength="60"
        placeholder="Ex.: Conta corrente"
        cdkFocusInitial
      />
      <mat-error>Informe o nome da conta.</mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Saldo inicial (R$)</mat-label>
      <input matInput type="number" step="0.01" formControlName="saldoInicial" />
      <mat-hint>Quanto havia na conta antes do primeiro lançamento.</mat-hint>
      <mat-error>Informe o saldo inicial.</mat-error>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancelar</button>
    <button mat-flat-button type="submit" [disabled]="envio.enviando()">Salvar</button>
  </mat-dialog-actions>
</form>
