# Serve o Angular e repassa /api para o Quarkus. Front e API na mesma origem:
# os cookies SameSite=Strict funcionam e não é preciso liberar CORS.

# Atrás do túnel Cloudflare o IP real vem no header CF-Connecting-IP.
# Só confiamos nele vindo da rede local/Docker (o nginx não é exposto diretamente).
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
real_ip_header CF-Connecting-IP;

# Freia força bruta em login/cadastro/refresh: 20 requisições por minuto por IP.
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/proxy-api.inc;
    }

    location /api/ {
        include /etc/nginx/conf.d/proxy-api.inc;
    }

    # Arquivos com hash no nome podem ficar em cache; o index.html nunca.
    location ~* \.(js|css|woff2|png|svg|ico)$ {
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri /index.html;
    }
}
