# Apenas o banco, para desenvolver com "./mvnw quarkus:dev" e "npm start".
# Credenciais fixas de propósito: este banco só existe na sua máquina, em 127.0.0.1.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: financeiro
      POSTGRES_USER: financeiro
      POSTGRES_PASSWORD: financeiro
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

volumes:
  pgdata-dev:
