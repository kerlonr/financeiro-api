# ---------- API ----------
quarkus.rest.path=/api
quarkus.http.limits.max-body-size=64K
quarkus.jackson.serialization-inclusion=non-null

# ---------- Banco de dados ----------
# dev: Postgres do docker-compose.dev.yml | test: Dev Services (Testcontainers) | prod: variáveis de ambiente
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/financeiro
%dev.quarkus.datasource.username=financeiro
%dev.quarkus.datasource.password=financeiro
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# O schema é criado e versionado pelo Flyway (src/main/resources/db/migration).
# O Hibernate só confere se as entidades batem com as tabelas.
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

# ---------- Autenticação (JWT em cookie httpOnly) ----------
mp.jwt.verify.issuer=financeiro
smallrye.jwt.new-token.issuer=financeiro
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=access_token
# Em dev/test o Quarkus gera um par de chaves RSA temporário. Em produção as chaves vêm de arquivos.
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_PATH}
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_PATH}

financeiro.auth.access-token=15M
financeiro.auth.refresh-token=8H
financeiro.auth.cookie-secure=true
%dev.financeiro.auth.cookie-secure=false
%test.financeiro.auth.cookie-secure=false
financeiro.auth.max-tentativas=5
financeiro.auth.bloqueio=15M

# Tudo em /api exige login, exceto as rotas de entrada.
# Autenticação sob demanda: um cookie vencido não bloqueia o login nem a renovação.
quarkus.http.auth.proactive=false
quarkus.http.auth.permission.publico.paths=/api/auth/login,/api/auth/cadastro,/api/auth/refresh,/api/auth/logout
quarkus.http.auth.permission.publico.policy=permit
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated
